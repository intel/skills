  intel-products: ""
  intel-hw-class: "cpu"
  intel-source-ledger: ""

# The twenty entries below are the second upstream repository: intel/gpu-ai-skills,
# Apache-2.0, pinned at 3fb51a0b6952. Same mechanism, three things worth knowing.
#
# One entry per upstream skill, again under upstream's own name — twenty entries
# rather than one "gpu-ai" umbrella, because these skills route against each other
# by name in their own descriptions ("use vllm-xpu-run", "route those to
# bench/deploy/recommend"). An umbrella entry would give an agent one description
# for twenty routing decisions and break the cross-references upstream relies on.
#
# The repository also ships plugins/intel-gpu-ai-skills/skills/../template/, whose
# SKILL.md is named `template-skill`. It is not listed here: it is a scaffold, not a
# skill, and the identity rule in tools/sync_external.py would reject the import
# anyway because the directory name and the frontmatter name disagree.
#
# intel-products claims only the vocabulary upstream's own description carries, and
# nothing more. Two of the twenty (vllm-xpu-profile, xpu-port) name no Intel product
# at all in their description — they earn the empty-products warning rather than a
# claim this repository cannot back, because the description is upstream's own text and
# a product added here would only turn the warning into a reachability error.

