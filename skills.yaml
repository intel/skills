# Skill registry for github.com/intel/skills
#
# Every directory under skills/ must have exactly one entry here, and every entry
# must have a directory. tools/validate_skills.py checks both directions.
#
# An entry is two lines — the name, and the maintainer's GitHub handle, which for an
# Intel contributor is rarely the same string as their Intel username:
#
#   - name: your-skill-name
#     maintainer: "your-github-handle"
#
# Everything below is optional. status lives ONLY here, never in SKILL.md
# frontmatter, and there are two values:
#
#   published   the default, and what an entry means when it says nothing. The skill
#               is in the catalog and agents load it.
#   validated   hardware measurements stand behind it: perf/ with all three files
#               and a current behaviour digest, references/official-sources.md,
#               intel-source-ledger, intel-hw-validated-on, and a capability suite.
#               A maintainer sets it, in a separate PR from the one adding the skill.
#
# Intel catalog fields (intel-*) belong here, not in frontmatter, so SKILL.md stays
# conformant to the agentskills.io spec and portable across agent platforms.
#
#   intel-products          comma-separated canonical Intel product names. Fill it in
#                           and the validator checks the description carries their
#                           vocabulary; leave it out and that check does not run
#   intel-hw-class          cpu | gpu | npu | accelerator
#   intel-hw-validated-on   semicolon-separated specific SKUs; required for validated
#   intel-source-ledger     path to the skill's references/official-sources.md;
#                           required for validated
#
# An empty intel-* value means "does not apply", not "to be filled in later" — so
# leave the field out rather than writing an empty string.
#
#   license                 defaults to Apache-2.0, this repository's own licence, which
#                           is what a skill written here is published under. Set it when
#                           a skill arrived under other terms: this is where the licence
#                           is recorded, and a license in SKILL.md may repeat it but not
#                           contradict it. SKILL.md does not have to carry one at all
#
# An imported entry carries four more fields: the pin naming the upstream commit its
# directory under skills/ is a copy of. The copy is produced from the pin by
# tools/sync_external.py rather than written by hand — the pin is what needs review —
# and it keeps the name upstream gives it, so an agent routing by name finds the skill
# every other catalog knows:
#
#   - name: upstream-skill-name
#     maintainer: "your-github-handle"
#     external-repo: "https://github.com/intel/example-skills"
#     external-commit: "<full 40-char SHA; a branch or tag would let the copy drift>"
#     external-path: "skills/upstream-skill-name"
#     external-license: "MIT"   # upstream's, which is why the field exists at all
#
# The skill then ships a .source.json stating those same four, so an installed copy
# carries its own provenance; NOTICE names the upstream it republishes; and
# `python3 tools/sync_external.py --check` re-fetches the pinned commit and byte-compares.

# Ten of the entries below were adapted from existing Intel dpnp, oneMKL and oneTBB
# material rather than written here. Every technical claim and code block is that
# material's; what changed is that unmeasured speedup multipliers were dropped and
# four self-contradictions corrected. No measurement taken before that adaptation
# describes these files, which is why perf/ is empty and none of them is validated.

