# addressed inside two files that could not come over whole.
- name: dpnp-migration
  maintainer: "xaleryb"
  # dpnp only, though step 6 uses dpctl's device objects: the field drives the
  # trigger-vocabulary check, and someone porting CuPy code types "dpnp", not
  # "dpctl". Naming dpctl here would force a word into the description that no
  # user of this skill would search for.
  intel-products: "dpnp"
