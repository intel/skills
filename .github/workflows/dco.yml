name: DCO

# CONTRIBUTING.md's "Licence and sign-off" section tells every contributor that each
# commit needs a Signed-off-by trailer. Nothing enforced it, so the requirement was documentation
# rather than a gate. Keyless and offline, so it runs on a pull request from a fork.

on:
  pull_request:

permissions:
  contents: read

# One run per ref, and a superseded run is cancelled rather than queued behind the
# one that replaced it: a contributor pushing a fixup should not wait for the CI of
# the commit they just replaced. Keyed on head_ref for a pull request and on ref
# otherwise, so a pull request and the branch it targets never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  signed-off:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Check out the pull request's head, not the synthetic merge commit
          # GitHub builds for a pull_request event. That merge commit is created
          # by GitHub, carries no Signed-off-by trailer, and is not part of what
          # a contributor is certifying -- treating it as one made every pull
          # request fail DCO no matter how carefully its commits were signed.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The range has to be computable before anything is certified. `set -e` does
          # not propagate a failure out of a process substitution, so reading the commit
          # list straight from `< <(git rev-list ...)` made an unresolvable base commit
          # -- a force-pushed base branch, an incomplete fetch -- print `fatal:` and pass
          # the job with nothing checked. A legal gate that cannot see the commits must
          # fail, not wave them through.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::base commit ${BASE_SHA} is not in this checkout, so the commits to certify cannot be listed"
            exit 1
          fi
          missing=0
          # `--no-merges`: the trailer certifies the origin of contributed code, and a
          # merge commit contributes none -- it records that two histories were joined.
          # Requiring one on a merge is also incompatible with stacked pull requests,
          # where keeping a branch current means merging its base: `git merge` does not
          # add the trailer, so every stack would have to be rebased instead, rewriting
          # commits reviewers have already read. This is what the DCO GitHub App and the
          # kernel's own checkpatch do. The cost is that content introduced in a merge
          # resolution is uncertified; that content is also invisible in the per-commit
          # diffs a reviewer reads, which is a reason to keep resolutions trivial rather
          # than a reason to demand a trailer here.
          commits="$(git rev-list --no-merges "${BASE_SHA}..HEAD")"
          for sha in $commits; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+>$'; then
              echo "::error::commit $sha is missing a 'Signed-off-by' trailer (run: git commit --amend -s)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more commits are not signed off under the Developer Certificate of Origin (https://developercertificate.org/)." >&2
            exit 1
          fi
