name: Skill security scan

# The gate whose subject is what a skill would do to the machine that installs it.
# validate.yml asks whether a skill is well-formed; this asks whether it is safe, using
# NVIDIA SkillSpector — 71 patterns across 17 categories, an AST pass over the scripts a
# skill ships, YARA signatures, and an OSV.dev lookup for the dependencies a skill
# names. tools/validate_skills.py keeps its own five hand-written content shapes: they
# are the ones this repository will not wait for someone else's release to enforce.
#
# Keyless and fork-safe, for the same reason validate.yml is: the scan runs static
# analysis only (--no-llm), so no model credential is needed and a pull request from a
# fork gets the same result as one from a branch. SkillSpector's semantic stage would
# raise precision, and it is deliberately not here — a check that cannot run in a fork
# does not gate a contribution.
#
# Installed from a commit-pinned git URL rather than from a marketplace action, because
# SkillSpector publishes neither an action nor a container image. Nothing third-party is
# handed a token and no organisation's allowed-actions policy has to list anything new.
# The pin is the full 40-character commit for the same reason skills.yaml demands one of
# an imported skill: a tag can be moved under the thing that points at it.
#
# Dependabot does not move this pin — it watches the github-actions ecosystem and this
# repository ships no Python manifest — so the weekly run is what makes a stale scanner
# visible. It is also what catches a finding nobody here caused: SkillSpector's rule set
# grows, OSV.dev learns about a dependency a skill names, and either can turn a skill
# that passed last week into one that needs a look.
#
# Outbound HTTPS to api.osv.dev is used for live vulnerability data. When it is
# unreachable SkillSpector falls back to a built-in list rather than failing, so an
# outage on someone else's service cannot hold a contributor's pull request.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, offset from the other two scheduled workflows so three runs do not start
    # in the same minute.
    - cron: "47 9 * * 1"

permissions:
  contents: read

# One run per ref, and a superseded run is cancelled rather than queued behind the one
# that replaced it: a contributor pushing a fixup should not wait for the CI of the
# commit they just replaced. Keyed on head_ref for a pull request and on ref otherwise,
# so a pull request and the branch it targets never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # For the SARIF upload, and only in a run that can have it: a fork's token is
      # read-only whatever this says. Same grant codeql.yml already makes.
      security-events: write
    env:
      # SkillSpector v2.11.2. Moving this is a reviewed change, not a rubber stamp: the
      # baseline suppresses by rule id, so a new version can report a rule this catalog
      # has never triaged. Bump it in a pull request of its own and read the table.
      SKILLSPECTOR_COMMIT: 69dcdfb74487d361ba4c811d088cfdea2ff3a9dc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Full history, because the last step diffs against the base commit to find
          # the imports whose pin this pull request moved. Cheap on a repository of
          # text files.
          fetch-depth: 0

      # Pin the interpreter rather than take whatever the runner image ships, so a
      # change in the image cannot quietly change what the gate ran on. SkillSpector
      # requires 3.12 or newer.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install SkillSpector
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "skillspector @ git+https://github.com/NVIDIA/skillspector.git@${SKILLSPECTOR_COMMIT}"

      # The wrapper runs the 33 scans concurrently, applies .skillspector-baseline.yaml,
      # writes the table to the step summary, and fails a skill above the threshold its
      # origin is held to: 20 — SkillSpector's LOW band — for a skill written here,
      # which can be fixed in the pull request that reported the problem, and 50 — the
      # scanner's own DO_NOT_INSTALL boundary — for an imported body, which cannot,
      # because sync_external.py --check requires it to stay byte-for-byte the pinned
      # upstream commit. Same split, and the same reason for it, as the mentions check
      # and the link check in validate.yml. The JSON is kept in the workspace for a
      # maintainer re-running the job with a debug session; it is not uploaded, because
      # the table is what a reviewer actually reads.
      # Which skills this pull request added or changed. The scan reports those in full
      # rather than as a row in a table of 33: a reviewer reading a two-skill diff
      # should not have to find their two findings among the catalog's. Names are
      # filtered to kebab-case here — they come from the tree the pull request brings,
      # and they are about to be passed to a shell.
      - name: Find the skills this change touches
        id: touched
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          names=$(git diff --name-only "${BASE_SHA}" HEAD -- skills/ \
            | cut -d/ -f2 \
            | sort -u \
            | while read -r name; do
                # Kebab-case only, and never a leading dash: these names are about to
                # be a shell's argv. Written as a case rather than a grep because grep
                # exits 1 when a change touches no skill at all, which under
                # pipefail would fail the step for the commonest kind of pull request.
                case "${name}" in
                  "" | -* | *[!a-z0-9-]*) continue ;;
                esac
                if [ -f "skills/${name}/SKILL.md" ]; then echo "${name}"; fi
              done \
            | tr '\n' ' ')
          echo "skills=${names}" >> "${GITHUB_OUTPUT}"
          echo "Touched: ${names:-none}"

      # --annotate turns each finding into a workflow command, so it renders against
      # the file and line in Files changed instead of only in this log. --detail prints
      # the full finding — matched text, what the rule says, what it wants done — for
      # the skills above, into the step summary.
      - name: Scan every skill
        env:
          TOUCHED: ${{ steps.touched.outputs.skills }}
          # SARIF costs a second pass over every skill, because the CLI writes one
          # format per run and this gate reads the score out of the JSON. Only asked
          # for when there is somewhere to send it: code scanning needs
          # security-events: write, which the token of a pull request from a fork does
          # not carry. A fork therefore keeps the one-pass scan, and the step below
          # says so on the run rather than leaving a gap.
          SARIF: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          sarif=""
          if [ "${SARIF}" = "true" ]; then
            sarif="--sarif ${RUNNER_TEMP}/skillspector.sarif"
          fi
          # shellcheck disable=SC2086  # word splitting is how the names become argv
          python3 tools/scan_skills.py --annotate \
            --json "${RUNNER_TEMP}/skillspector.json" \
            ${sarif} \
            ${TOUCHED:+--detail ${TOUCHED}}

      # Code scanning is what turns a run into something trackable: every active finding
      # becomes an alert on its file and line, the pull request shows the ones its diff
      # introduced, and the Security tab keeps the history — which finding appeared in
      # which commit, and when one went away. Only the active ones: code scanning ignores
      # a SARIF `suppressions` entry, so uploading what the baseline accepts would put
      # 197 alerts nobody will act on in front of the 17 that want reading. Those keep
      # their reasons in .skillspector-baseline.yaml and their counts in the table.
      # Uploaded even when the scan failed, because the alerts are how a reviewer sees
      # which finding failed it. Same digest-pinned action the CodeQL workflow already
      # uses; `category` keeps these alerts from clobbering its own.
      - name: Send the findings to code scanning
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          sarif_file: ${{ runner.temp }}/skillspector.sarif
          category: skillspector

      - name: Say that code scanning was skipped
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          {
            echo "### Code scanning upload skipped"
            echo
            echo "This pull request comes from a fork, whose token cannot write"
            echo "security events. The table above and the annotations on the diff carry"
            echo "the same findings; the alerts appear once the change is on \`main\`."
          } >> "${GITHUB_STEP_SUMMARY}"

      # A pull request that moves an import's pin brings new upstream text with it, and
      # that is the moment to read that skill's findings again rather than to carry over
      # the answer from the commit before. This step holds the imports whose pin moved
      # to the stricter threshold, so the reviewer of the bump sees what a skill written
      # here would have had to fix. Reported, not blocking: the repair for an import
      # lands upstream, so failing the bump would block the pull request on work that
      # cannot be done in it — the same argument that makes the link check a warning in
      # an imported body.
      - name: Re-read the imports whose pin moved
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          moved=$(git diff --name-only "${BASE_SHA}" HEAD -- 'skills/*/.source.json' \
            | cut -d/ -f2 | sort -u)
          if [ -z "${moved}" ]; then
            echo "No import pin moved in this pull request."
            exit 0
          fi
          # shellcheck disable=SC2086  # word splitting is how the names become argv
          python3 tools/scan_skills.py --strict-imports --report-only \
            --summary-title "Imports whose pin moved, read strictly" ${moved}
