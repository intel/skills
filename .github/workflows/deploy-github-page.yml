name: Deploy GitHub Pages

# Builds the Astro catalog from two branches: `github_page_src` (site) and `main`
# (skills.yaml + skill trees). Runs on every push to main so catalog changes ship;
# push an empty commit to main after updating `github_page_src` if only the site changed.

on:
  push:
    branches: [main]

# Read-only at the workflow level. The two write scopes Pages needs belong to the one
# job that deploys, and are granted there: `build` runs `npm ci` and `npm run build`
# over a lockfile and a second checked-out branch, which is the step in this workflow
# where third-party code executes, and it has no reason to hold a token that can
# publish a site or mint an OIDC identity.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out catalog (main)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          path: catalog
          persist-credentials: false

      - name: Check out webpage (github_page_src)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: github_page_src
          path: webpage
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: webpage/.nvmrc
          cache: npm
          cache-dependency-path: webpage/package-lock.json

      - name: Install dependencies
        working-directory: webpage
        run: npm ci

      - name: Build static site
        working-directory: webpage
        env:
          CATALOG_ROOT: ${{ github.workspace }}/catalog
          SITE_BASE: /skills/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: webpage/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
