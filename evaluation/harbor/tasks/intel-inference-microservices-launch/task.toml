schema_version = "1.3"

[metadata]
skill = "intel-inference-microservices"
# Named by the author; a maintainer reconciles them when a suite claims this task.
covers = ["launch-correctness"]
author_name = "Ezequiel Lanza"
author_email = "ezequiel.lanza@intel.com"
difficulty = "easy"
difficulty_explanation = "The launch has to use the catalog image for this Xeon host and the flags the engine needs to start"
category = "programming"
tags = ["docker", "intel", "xeon", "inference"]

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 300.0

[environment]
build_timeout_sec = 600.0
network_mode = "no-network"
cpus = 2
memory_mb = 2048
storage_mb = 4096
# The command is parsed, not run, so no Xeon host is required and the task runs in CI.
gpus = 0
