schema_version = "1.3"

[metadata]
# The task -> skill link is this field, not the directory path: `harbor run` needs
# a single discovery root, so tasks cannot nest under skills/.
skill = "mkl-extension-advisor"
# Capability ids declared by this skill's suite in ../../suites.json, which owns the
# capability class and the smoke/discriminating role. Kept here too so the task is
# self-describing in `harbor view --tasks`; validate_skills.py checks they agree.
covers = ["activation-correctness", "state-probe-triage"]
author_name = "Nikolay Petrov"
author_email = "nikolay.a.petrov@intel.com"
difficulty = "medium"
difficulty_explanation = "Requires activating mkl_fft so existing np.fft call sites dispatch to oneMKL without rewriting them, proving activation via np.fft.fft.__module__ rather than is_patched(), and matching a NumPy reference within tolerance rather than bitwise"
category = "programming"
tags = ["python", "mkl_extensions", "mkl_fft", "fft", "numpy", "oneMKL", "intel"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 300.0

[environment]
build_timeout_sec = 600.0
# Network is needed for the image build and for nothing after it.
network_mode = "no-network"
cpus = 4
memory_mb = 4096
storage_mb = 8192
gpus = 0
