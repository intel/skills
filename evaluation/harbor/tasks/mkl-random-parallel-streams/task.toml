schema_version = "1.3"

[metadata]
# The task -> skill link is this field, not the directory path: `harbor run` needs
# a single discovery root, so tasks cannot nest under skills/.
skill = "mkl-extension-advisor"
# Capability ids declared by this skill's suite in ../../suites.json, which owns the
# capability class and the smoke/discriminating role. Kept here too so the task is
# self-describing in `harbor view --tasks`; validate_skills.py checks they agree.
covers = ["activation-correctness", "surface-routing"]
author_name = "Nikolay Petrov"
author_email = "nikolay.a.petrov@intel.com"
difficulty = "hard"
difficulty_explanation = "Requires knowing that independent streams come from a parametrized generator family (or an explicit jump) rather than from reseeding one generator, that the skipahead/leapfrog support matrix is not uniform across brng families, and that mkl_random is not seed-compatible with numpy.random so the analytic 1/4 is the only valid contract"
category = "programming"
tags = ["python", "mkl_extensions", "mkl_random", "monte-carlo", "rng", "numpy", "oneMKL", "intel"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
# Network is needed for the image build and for nothing after it.
network_mode = "no-network"
cpus = 4
memory_mb = 4096
storage_mb = 8192
gpus = 0
