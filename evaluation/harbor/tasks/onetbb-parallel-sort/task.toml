schema_version = "1.3"

[metadata]
# The task -> skill link is this field, not the directory path: `harbor run` needs
# a single discovery root, so tasks cannot nest under skills/.
skill = "onetbb-quickstart"
# Capability ids declared by this skill's suite in ../../suites.json, which owns the
# capability class and the smoke/discriminating role. Kept here too so the task is
# self-describing in `harbor view --tasks`; validate_skills.py checks they agree.
covers = ["algorithm-correctness", "build-integration"]
author_name = "Nikolay Petrov"
author_email = "nikolay.a.petrov@intel.com"
difficulty = "medium"
difficulty_explanation = "Requires knowledge of oneTBB API and C++ build toolchain"
category = "programming"
tags = ["c++", "parallel", "onetbb", "hpc", "performance"]

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 300.0

[environment]
# This is the only task in the suite that compiles oneTBB from source instead of
# apt-installing libtbb-dev, and harbor spends this budget on `environment.start()`
# as a whole — image build included — raising EnvironmentStartTimeoutError when it
# runs out. 300 s is ample on an idle 16-core host (measured: 49 s for a cold
# `docker build --no-cache`) and not ample on a shared runner building two images at
# once, where the whole 15-task set was measured at 31 minutes. A timeout is a ceiling
# and not a budget, so a fast host still finishes in its 49 s.
build_timeout_sec = 1800.0
# Network is needed for the image build and for nothing after it.
network_mode = "no-network"
cpus = 4
memory_mb = 2048
storage_mb = 5120
gpus = 0
