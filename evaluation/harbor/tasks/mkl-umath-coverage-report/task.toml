schema_version = "1.3"

[metadata]
# The task -> skill link is this field, not the directory path: `harbor run` needs
# a single discovery root, so tasks cannot nest under skills/.
skill = "mkl-extension-advisor"
# Capability ids declared by this skill's suite in ../../suites.json, which owns the
# capability class and the smoke/discriminating role. Kept here too so the task is
# self-describing in `harbor view --tasks`; validate_skills.py checks they agree.
covers = ["activation-correctness", "state-probe-triage"]
author_name = "Nikolay Petrov"
author_email = "nikolay.a.petrov@intel.com"
difficulty = "hard"
difficulty_explanation = "Requires activating mkl_umath without rewriting the kernel, then determining from the installed registry which of the kernel's ufuncs are actually registered and which dtype loops each carries, rather than reciting a remembered coverage list. Patching is signature-matched, so an unregistered ufunc or an absent dtype cannot be accelerated at any array size"
category = "programming"
tags = ["python", "mkl_extensions", "mkl_umath", "ufunc", "numpy", "oneMKL", "intel"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
# Network is needed for the image build and for nothing after it.
network_mode = "no-network"
cpus = 4
memory_mb = 4096
storage_mb = 8192
gpus = 0
